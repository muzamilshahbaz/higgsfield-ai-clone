<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Runway sample — a coastal cliff under a low sun, slow dolly in">
  <defs>
    <linearGradient id="sky-runway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="52%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="glow-runway" cx="40%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#a5f3fc" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-runway">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#04060f"/>

  <g transform-origin="640 360">
    <animateTransform attributeName="transform" type="scale" values="1;1.09;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <rect width="1280" height="720" fill="url(#sky-runway)"/>
    <rect width="1280" height="720" fill="url(#glow-runway)"/>
    <path d="M0 720 L0 417.59999999999997 L0 461.9 L160 424.1 L320 371.6 L480 423.0 L640 462.2 L800 400.7 L960 377.3 L1120 444.8 L1280 450.9 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 469.59999999999997 L0 495.0 L200 443.9 L400 450.9 L600 500.2 L800 480.4 L1000 436.2 L1200 467.3 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 521.5999999999999 L0 518.1 L240 500.5 L480 530.5 L720 540.4 L960 507.8 L1200 506.3 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 415.59999999999997 L1280 415.59999999999997" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="348" width="1280" height="3" fill="#7dd3fc" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-runway)" opacity="0.5"/>
</svg>
