<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Google Veo sample — a desert highway at dusk with a drone pull back">
  <defs>
    <linearGradient id="sky-veo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="52%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <radialGradient id="glow-veo" cx="46%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#fde68a" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-veo">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#0a0505"/>

  <g transform-origin="640 360">
    <animateTransform attributeName="transform" type="scale" values="1.12;1;1.12" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <rect width="1280" height="720" fill="url(#sky-veo)"/>
    <rect width="1280" height="720" fill="url(#glow-veo)"/>
    <path d="M0 720 L0 475.20000000000005 L0 498.9 L160 433.1 L320 462.3 L480 520.7 L640 476.3 L800 429.5 L960 485.8 L1120 518.2 L1280 453.5 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 527.2 L0 512.2 L200 498.9 L400 549.5 L600 549.7 L800 499.1 L1000 511.9 L1200 559.3 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 579.2 L0 557.3 L240 579.6 L480 601.0 L720 573.2 L960 559.0 L1200 590.4 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 473.20000000000005 L1280 473.20000000000005" stroke="#fdba74" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="405" width="1280" height="3" fill="#fdba74" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-veo)" opacity="0.5"/>
</svg>
