<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Kling AI sample — a figure on a rooftop as the camera orbits">
  <defs>
    <linearGradient id="sky-kling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1d6e"/>
      <stop offset="52%" stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#05050c"/>
    </linearGradient>
    <radialGradient id="glow-kling" cx="34%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#fb7185" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-kling">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#05050c"/>

  <g transform-origin="640 360">
    <animateTransform attributeName="transform" type="translate" values="-22 0;22 0;-22 0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <rect width="1280" height="720" fill="url(#sky-kling)"/>
    <rect width="1280" height="720" fill="url(#glow-kling)"/>
    <path d="M0 720 L0 446.4 L0 446.4 L160 492.0 L320 434.6 L480 403.8 L640 469.1 L800 483.1 L960 414.2 L1120 418.0 L1280 485.9 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 498.4 L0 527.0 L200 512.9 L400 466.0 L600 492.2 L800 532.4 L1000 495.8 L1200 465.1 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 550.4 L0 570.4 L240 538.7 L480 533.4 L720 566.4 L960 563.3 L1200 531.0 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 444.4 L1280 444.4" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="376" width="1280" height="3" fill="#fbbf24" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-kling)" opacity="0.5"/>
</svg>
