<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Flux sample — a neon city skyline still, sharp and static">
  <defs>
    <linearGradient id="sky-flux" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="52%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#07040f"/>
    </linearGradient>
    <radialGradient id="glow-flux" cx="58%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#f0abfc" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-flux">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#07040f"/>

  <g transform-origin="640 360">
    <animate attributeName="opacity" values="1;0.92;1" dur="12s" repeatCount="indefinite"/>
    <rect width="1280" height="720" fill="url(#sky-flux)"/>
    <rect width="1280" height="720" fill="url(#glow-flux)"/>
    <path d="M0 720 L0 396.00000000000006 L0 355.4 L160 422.6 L320 429.8 L480 360.7 L640 371.3 L800 437.7 L960 409.9 L1120 350.7 L1280 393.7 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 448.00000000000006 L0 445.2 L200 482.0 L400 442.1 L600 415.6 L800 462.3 L1000 476.8 L1200 426.3 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 500.00000000000006 L0 517.5 L240 511.0 L480 479.7 L720 494.2 L960 521.8 L1200 500.2 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 394.00000000000006 L1280 394.00000000000006" stroke="#d8b4fe" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="326" width="1280" height="3" fill="#d8b4fe" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-flux)" opacity="0.5"/>
</svg>
