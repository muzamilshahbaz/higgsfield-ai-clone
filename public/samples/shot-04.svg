<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Push In sample shot">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="55%" stop-color="#0d1f16"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="glow4" cx="62%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#86efac" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04040a" stop-opacity="1"/>
    </linearGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#05050a"/>

  <g transform-origin="540 540">
    <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="9s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <rect width="1080" height="1080" fill="url(#sky4)"/>
    <rect width="1080" height="1080" fill="url(#glow4)"/>

    <!-- horizon haze -->
    <rect y="594" width="1080" height="64" fill="#86efac" opacity="0.07"/>

    <!-- far ridge -->
    <path d="M0 669 L237 594 L518 712 L799 615 L1080 648 L1080 1080 L0 1080 Z" fill="url(#ridge4)" opacity="0.85"/>
    <!-- near ridge -->
    <path d="M0 820 L356 756 L734 864 L1080 777 L1080 1080 L0 1080 Z" fill="#04040a" opacity="0.92"/>

    <!-- light shafts -->
    <g opacity="0.16">
      <rect x="302" y="0" width="59" height="1080" fill="#fef3c7" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.10;0.32;0.10" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="669" y="0" width="32" height="1080" fill="#86efac" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.26;0.08;0.26" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- drifting particles -->
    <g fill="#fef3c7" opacity="0.5">
      <circle cx="194" cy="432" r="3">
        <animate attributeName="cy" values="432;324;432" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="777" cy="324" r="2">
        <animate attributeName="cy" values="324;475;324" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.12;0.5" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="561" cy="518" r="3">
        <animate attributeName="cy" values="518;388;518" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- film grain + vignette, outside the moving group -->
  <rect width="1080" height="1080" filter="url(#grain4)" opacity="0.5"/>
  <rect width="1080" height="1080" fill="none" stroke="#000" stroke-width="151" opacity="0.5"/>
</svg>
