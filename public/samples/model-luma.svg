<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Luma sample — a fog-filled valley with a slow crane up">
  <defs>
    <linearGradient id="sky-luma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="52%" stop-color="#0f2f30"/>
      <stop offset="100%" stop-color="#04090a"/>
    </linearGradient>
    <radialGradient id="glow-luma" cx="52%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#bbf7d0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-luma">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#04090a"/>

  <g transform-origin="640 360">
    <animateTransform attributeName="transform" type="translate" values="0 16;0 -16;0 16" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <rect width="1280" height="720" fill="url(#sky-luma)"/>
    <rect width="1280" height="720" fill="url(#glow-luma)"/>
    <path d="M0 720 L0 503.99999999999994 L0 472.4 L160 475.0 L320 543.1 L480 523.0 L640 460.0 L800 496.4 L960 550.0 L1120 499.8 L1280 459.1 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 556 L0 522.6 L200 566.6 L400 586.7 L600 537.5 L800 530.1 L1000 581.2 L1200 575.4 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 608 L0 599.8 L240 629.3 L480 610.7 L720 586.0 L960 610.9 L1200 629.2 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 501.99999999999994 L1280 501.99999999999994" stroke="#5eead4" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="434" width="1280" height="3" fill="#5eead4" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-luma)" opacity="0.5"/>
</svg>
