<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Vertical Orbit sample shot">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d3a"/>
      <stop offset="55%" stop-color="#2a0a18"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="54%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fda4af" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04040a" stop-opacity="1"/>
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#05050a"/>

  <g transform-origin="540 960">
    <animateTransform attributeName="transform" type="rotate" values="-2.5;2.5;-2.5" dur="13s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <rect width="1080" height="1920" fill="url(#sky3)"/>
    <rect width="1080" height="1920" fill="url(#glow3)"/>

    <!-- horizon haze -->
    <rect y="1056" width="1080" height="115" fill="#fda4af" opacity="0.07"/>

    <!-- far ridge -->
    <path d="M0 1190 L237 1056 L518 1267 L799 1094 L1080 1152 L1080 1920 L0 1920 Z" fill="url(#ridge3)" opacity="0.85"/>
    <!-- near ridge -->
    <path d="M0 1459 L356 1344 L734 1536 L1080 1382 L1080 1920 L0 1920 Z" fill="#04040a" opacity="0.92"/>

    <!-- light shafts -->
    <g opacity="0.16">
      <rect x="302" y="0" width="59" height="1920" fill="#fde68a" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.10;0.32;0.10" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="669" y="0" width="32" height="1920" fill="#fda4af" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.26;0.08;0.26" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- drifting particles -->
    <g fill="#fde68a" opacity="0.5">
      <circle cx="194" cy="768" r="3">
        <animate attributeName="cy" values="768;576;768" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="777" cy="576" r="2">
        <animate attributeName="cy" values="576;844;576" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.12;0.5" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="561" cy="921" r="3">
        <animate attributeName="cy" values="921;691;921" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- film grain + vignette, outside the moving group -->
  <rect width="1080" height="1920" filter="url(#grain3)" opacity="0.5"/>
  <rect width="1080" height="1920" fill="none" stroke="#000" stroke-width="151" opacity="0.5"/>
</svg>
