<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Drone Pull sample shot">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e4f6e"/>
      <stop offset="55%" stop-color="#031b2e"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="glow2" cx="46%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#67e8f9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04040a" stop-opacity="1"/>
    </linearGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#05050a"/>

  <g transform-origin="960 540">
    <animateTransform attributeName="transform" type="translate" values="0,0;-90,0;0,0" dur="11s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    <rect width="1920" height="1080" fill="url(#sky2)"/>
    <rect width="1920" height="1080" fill="url(#glow2)"/>

    <!-- horizon haze -->
    <rect y="594" width="1920" height="64" fill="#67e8f9" opacity="0.07"/>

    <!-- far ridge -->
    <path d="M0 669 L422 594 L921 712 L1420 615 L1920 648 L1920 1080 L0 1080 Z" fill="url(#ridge2)" opacity="0.85"/>
    <!-- near ridge -->
    <path d="M0 820 L633 756 L1305 864 L1920 777 L1920 1080 L0 1080 Z" fill="#04040a" opacity="0.92"/>

    <!-- light shafts -->
    <g opacity="0.16">
      <rect x="537" y="0" width="105" height="1080" fill="#e0f2fe" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.10;0.32;0.10" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="1190" y="0" width="57" height="1080" fill="#67e8f9" transform="skewX(-12)">
        <animate attributeName="opacity" values="0.26;0.08;0.26" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- drifting particles -->
    <g fill="#e0f2fe" opacity="0.5">
      <circle cx="345" cy="432" r="4">
        <animate attributeName="cy" values="432;324;432" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1382" cy="324" r="3">
        <animate attributeName="cy" values="324;475;324" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.12;0.5" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="998" cy="518" r="4">
        <animate attributeName="cy" values="518;388;518" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- film grain + vignette, outside the moving group -->
  <rect width="1920" height="1080" filter="url(#grain2)" opacity="0.5"/>
  <rect width="1920" height="1080" fill="none" stroke="#000" stroke-width="151" opacity="0.5"/>
</svg>
