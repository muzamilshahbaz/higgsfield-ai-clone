<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Google Imagen sample — a studio portrait backdrop with soft light">
  <defs>
    <linearGradient id="sky-imagen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="52%" stop-color="#4a0a24"/>
      <stop offset="100%" stop-color="#0b0408"/>
    </linearGradient>
    <radialGradient id="glow-imagen" cx="64%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#fecdd3" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-imagen">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#0b0408"/>

  <g transform-origin="640 360">
    <animate attributeName="opacity" values="1;0.92;1" dur="12s" repeatCount="indefinite"/>
    <rect width="1280" height="720" fill="url(#sky-imagen)"/>
    <rect width="1280" height="720" fill="url(#glow-imagen)"/>
    <path d="M0 720 L0 532.8 L0 542.7 L160 576.1 L320 511.8 L480 494.9 L640 563.6 L800 562.7 L960 494.3 L1120 512.8 L1280 576.5 L1280 720 Z" fill="#04040a" opacity="0.55"/>
    <path d="M0 720 L0 584.8 L0 616.7 L200 592.4 L400 551.0 L600 585.9 L800 618.4 L1000 575.0 L1200 553.8 L1280 720 Z" fill="#04040a" opacity="0.41"/>
    <path d="M0 720 L0 636.8 L0 654.4 L240 621.4 L480 623.2 L720 655.7 L960 645.5 L1200 615.6 L1280 720 Z" fill="#04040a" opacity="0.27"/>
    <path d="M0 530.8 L1280 530.8" stroke="#fda4af" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- anamorphic streak -->
  <rect x="0" y="463" width="1280" height="3" fill="#fda4af" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- letterbox, so a still reads as a frame rather than a wallpaper -->
  <rect width="1280" height="46" fill="#04040a" opacity="0.85"/>
  <rect y="674" width="1280" height="46" fill="#04040a" opacity="0.85"/>

  <rect width="1280" height="720" filter="url(#grain-imagen)" opacity="0.5"/>
</svg>
