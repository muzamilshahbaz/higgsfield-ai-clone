<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kinetic">
  <title>Kinetic</title>
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141419"/>
  <!-- The same mark as the site header: a gradient chip on the dark surface. -->
  <rect x="17" y="17" width="30" height="30" rx="9" fill="url(#k)"/>
  <!-- A shutter notch, so the mark reads as a camera rather than a square. -->
  <path d="M32 24 L42 32 L32 40 Z" fill="#141419" opacity="0.55"/>
</svg>
