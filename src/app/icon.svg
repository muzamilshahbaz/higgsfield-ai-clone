<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Kinetic Studio">
  <title>Kinetic Studio</title>
  <!--
    The same mark as components/brand/logo.tsx, with the token values resolved
    to hex: a favicon is fetched outside the page, so it cannot read a CSS
    variable. Keep the two in step — this is the only copy of the geometry.
  -->
  <rect width="32" height="32" rx="8" fill="#2f3339"/>
  <g transform="skewX(-18) translate(4.5 0)">
    <rect x="6" y="8" width="3.5" height="16" rx="1.75" fill="#4fd8ec"/>
    <rect x="12" y="10" width="3.5" height="12" rx="1.75" fill="#4fd8ec" opacity="0.55"/>
    <rect x="18" y="12.5" width="3.5" height="7" rx="1.75" fill="#f97c57"/>
  </g>
</svg>
